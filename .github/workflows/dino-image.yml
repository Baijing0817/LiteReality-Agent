name: DINO worker image

on:
  push:
    branches:
      - main
      - jchiu/repo-layout-restructure
    paths:
      - ".github/workflows/dino-image.yml"
      - ".dockerignore"
      - "src/litereality_agent/models/device.py"
      - "src/litereality_agent/models/dinov2/**"
      - "src/litereality_agent/models/grounding_dino/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dino-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk for CUDA layers
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tag
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/litereality-dino
          tags: type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/litereality_agent/models/grounding_dino/hosted/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=dino-worker
          cache-to: type=gha,mode=min,scope=dino-worker
