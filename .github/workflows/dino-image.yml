name: DINO worker image

on:
  push:
    branches:
      - main
      - jchiu/repo-layout-restructure
    paths:
      - ".github/workflows/dino-image.yml"
      - ".dockerignore"
      - "src/litereality_agent/models/device.py"
      - "src/litereality_agent/models/dinov2/**"
      - "src/litereality_agent/models/grounding_dino/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dino-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk for CUDA layers
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Temporary anonymous registry tag for the manual E2E deployment. The
      # image expires after 24 hours and contains no repository or API secrets.
      - name: Build and publish temporary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/litereality_agent/models/grounding_dino/hosted/Dockerfile
          push: true
          tags: ttl.sh/litereality-dino-6cf03126-d280-4e48-9572-b8e00d393f86:24h
          cache-from: type=gha,scope=dino-worker
          cache-to: type=gha,mode=min,scope=dino-worker
