name: Pipeline container

on:
  push:
    branches:
      - main
      - jchiu/repo-layout-restructure
    paths:
      - ".github/workflows/pipeline-image.yml"
      - ".dockerignore"
      - "docker/pipeline/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GitHub's hosted image reserves most of its disk for unrelated Android, .NET, Haskell,
      # and CodeQL toolchains. The CUDA/PyTorch image needs that space during layer assembly.
      - name: Reclaim runner disk for GPU image
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/litereality-pipeline
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and publish pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pipeline/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=pipeline-container
          cache-to: type=gha,mode=min,scope=pipeline-container
          provenance: true
          sbom: true
